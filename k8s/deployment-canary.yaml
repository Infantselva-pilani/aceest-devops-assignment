# Canary Deployment Strategy
# Send a small % of traffic to the new version while most users stay on stable
# Here: stable=3 replicas (75% traffic), canary=1 replica (25% traffic)
#
# HOW TO USE:
#   kubectl apply -f k8s/deployment-canary.yaml
#   Monitor canary: kubectl logs -l version=canary
#   Promote canary (when stable): update stable image tag, scale canary to 0
#     kubectl scale deployment aceest-fitness-canary --replicas=0
#   Rollback: kubectl scale deployment aceest-fitness-canary --replicas=0
#
# Author: Infant Selva | 2024TM93572

# ── Stable deployment (current version — 3 replicas = 75% traffic) ────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-stable
  labels:
    app: aceest-fitness
    version: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      version: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: stable
    spec:
      containers:
        - name: aceest-fitness
          image: selva015/aceest-fitness:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
# ── Canary deployment (new version — 1 replica = 25% traffic) ─────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-canary
  labels:
    app: aceest-fitness
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      version: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: canary
    spec:
      containers:
        - name: aceest-fitness
          # Use new version image tag here
          image: selva015/aceest-fitness:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
# ── Shared service — routes to BOTH stable and canary by app label ─────────
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-canary-service
spec:
  selector:
    app: aceest-fitness   # matches both stable and canary pods
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30083
