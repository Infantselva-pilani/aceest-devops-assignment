# SonarQube project configuration for ACEest Fitness & Gym
# Author: Infant Selva | 2024TM93572

sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.language=py

# Exclusions (don't scan these)
sonar.exclusions=venv/**,tests/**,**/__pycache__/**,*.db,*.xml

# Test file locations
sonar.tests=tests/
sonar.test.inclusions=tests/test_app.py

# Coverage report (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8
